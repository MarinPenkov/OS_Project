services:
  web:
    build: ./web
    container_name: course_web
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    build: ./database
    container_name: course_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: course_system
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: